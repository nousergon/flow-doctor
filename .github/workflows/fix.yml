name: Flow Doctor Fix (reusable)

permissions:
  contents: read

# Reusable workflow that generates a fix PR for a flow-doctor-filed issue.
#
# Calling repos do NOT copy this logic — they add a ~13-line stub that
# subscribes to the `issues: labeled` event (the one piece GitHub requires
# to live in each repo, since org-level workflows only cover push/PR) and
# delegates here, pinned to a flow-doctor tag:
#
#   name: Flow Doctor Fix
#   on:
#     issues:
#       types: [labeled]
#   jobs:
#     fix:
#       if: github.event.label.name == 'flow-doctor:fix'
#       permissions:
#         contents: write
#         pull-requests: write
#         issues: write
#       uses: nousergon/flow-doctor/.github/workflows/fix.yml@c3ca52e
#       secrets: inherit
#
# Cost is bounded upstream: flow-doctor.yaml caps issues at
# max_issues_per_day (-> that many label events -> that many runs/day), the
# fix model is Haiku, and diagnosis has a hard daily cap. Generated PRs are
# proposals (scope-guarded + test-gated) and are NEVER auto-merged.

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version for the fix run"
        type: string
        default: "3.12"
      requirements-file:
        description: "Path to the caller repo's requirements file (installed if present; brings the pinned flow-doctor[diagnosis,s3] via the lib pin)"
        type: string
        default: "requirements.txt"
      config-path:
        description: "Path to the caller repo's flow-doctor.yaml"
        type: string
        default: "flow-doctor.yaml"
      extra-pip-install:
        description: "Optional extra pip install args (e.g. 'flow-doctor[diagnosis,s3]==0.6.0rc6' if the caller's requirements don't bring the diagnosis extra)"
        type: string
        default: ""
    secrets:
      # `diagnosis.provider: anthropic` was REMOVED in 0.15.0 (flow-doctor no
      # longer depends on the `anthropic` distribution or constructs a
      # direct-Anthropic client anywhere). This secret is now provider-
      # neutral: set it when the caller's flow-doctor.yaml uses
      # `provider: openai_compat` (any OpenAI-compatible endpoint — the env
      # var below matches `OPENROUTER_API_KEY`, which flow_doctor.fix.cli
      # reads as its api_key fallback). NOT required when the caller uses
      # `provider: router` — krepis resolves its own credential, and the
      # caller's environment must already carry whatever that requires.
      OPENROUTER_API_KEY:
        description: "API key for the openai_compat fix transport (unused, and not required, under provider: router)"
        required: false

jobs:
  generate-fix:
    runs-on: ubuntu-latest
    # The reusable workflow declares what it needs; the caller's job-level
    # `permissions:` block caps the GITHUB_TOKEN, so the stub must grant
    # contents/pull-requests/issues write for PR creation to succeed.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        env:
          REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
          EXTRA_PIP_INSTALL: ${{ inputs.extra-pip-install }}
        run: |
          pip install --upgrade pip
          if [ -f "$REQUIREMENTS_FILE" ]; then pip install -r "$REQUIREMENTS_FILE"; fi
          pip install pytest
          if [ -n "$EXTRA_PIP_INSTALL" ]; then pip install $EXTRA_PIP_INSTALL; fi

      - name: Generate fix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          python -m flow_doctor.fix.cli generate-fix --issue-number "$ISSUE_NUMBER" --repo "$REPO" --token "$GITHUB_TOKEN" --config "$CONFIG_PATH"

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: '⚠️ Flow Doctor fix generation failed. See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            })
