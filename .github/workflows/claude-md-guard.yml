name: CLAUDE.md guard

# Fails CI if an agent-instruction file (AGENTS.md, the canonical one, or its
# CLAUDE.md symlink) is committed to this public repo, or is not gitignored.
# Both carry infra/IP-structure detail that must not be public (2026-03-22
# decision). Logic lives in the fleet chokepoint: nousergon-lib
# claude-md-guard.yml. Wired here by alpha-engine-config-I8049 (roster repos the 10-30 rollout missed).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  claude-md-untracked:
    uses: nousergon/nousergon-lib/.github/workflows/claude-md-guard.yml@02631f1accd98a1e5f20ab79299c5759c37022d5
