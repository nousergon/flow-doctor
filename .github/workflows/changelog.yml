name: System-wide deploy changelog

# Emits one JSON entry to s3://alpha-engine-research/changelog/ on every
# push-to-main. See alpha-engine-docs/.github/actions/append-changelog/README.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: changelog-main
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout (shallow)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: arn:aws:iam::711398986525:role/github-actions-lambda-deploy
          aws-region: us-east-1

      - name: Append to system-wide deploy changelog
        uses: cipher813/alpha-engine-docs/.github/actions/append-changelog@aafc271dbc1c4743f771a0b37cb1924e358a7367
        with:
          deploy_status: merged
          deploy_workflow: changelog.yml
