name: Flow Doctor Fix

on:
  issues:
    types: [labeled]

permissions:
  contents: read

jobs:
  generate-fix:
    if: github.event.label.name == 'flow-doctor:fix'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          # `diagnosis` (the anthropic SDK extra) was removed in 0.15.0 —
          # flow-doctor no longer depends on it anywhere. Install whichever
          # transport `flow-doctor.yaml`'s `diagnosis.provider` names:
          # `diagnosis-openai` for `openai_compat`, `router` for `router`.
          pip install -e ".[dev,diagnosis-openai,router]"

      - name: Generate fix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Set the credential matching flow-doctor.yaml's diagnosis.provider:
          # OPENROUTER_API_KEY for provider=openai_compat (or set
          # diagnosis.api_key directly), or nothing at all for
          # provider=router (krepis resolves its own credential).
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python -m flow_doctor.fix.cli generate-fix \
            --issue-number ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --token $GITHUB_TOKEN \
            --config flow-doctor.yaml

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: '⚠️ Flow Doctor fix generation failed. Check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            })
