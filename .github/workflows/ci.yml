name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The badge-publish step below writes `coverage.json` on the orphan
    # `badges` branch through the contents API. Nothing else in this job
    # writes, and the token is scoped no wider than that.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # `diagnosis` (the anthropic SDK extra) was removed in 0.15.0.
          # `krepis` (the `router` extra) is deliberately excluded here so
          # tests/test_router_provider.py's "krepis genuinely not installed"
          # case runs for real rather than being skipped.
          pip install -e ".[dev]"

      # Strict typing, BLOCKING (alpha-engine-config-I12607). Errors recorded in
      # `.basedpyright/baseline.json` are tolerated; any new one fails. On a PR the
      # baseline may only shrink: a count that grew for any rule means the baseline was
      # regenerated to absorb new errors, which is refused.
      # Missing RETURN annotations are not a pyright rule, so ruff's ANN rules run
      # over every source file the PR adds or changes: touch a file, annotate it.
      - name: Type check (basedpyright strict, baseline may only shrink)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          pip install --quiet basedpyright==1.40.2 ruff==0.17.1
          basedpyright
          if ! git diff --quiet -- .basedpyright/baseline.json; then
            echo "::warning::type errors were fixed but .basedpyright/baseline.json was not shrunk; run basedpyright locally and commit the smaller baseline."
            git checkout -- .basedpyright/baseline.json
          fi
          if [ -n "${BASE_REF}" ] && git fetch --quiet --depth=1 origin "${BASE_REF}"; then
            mapfile -t changed < <(git diff --name-only --diff-filter=AMR FETCH_HEAD HEAD -- 'flow_doctor/*.py')
            if [ "${#changed[@]}" -gt 0 ]; then
              ruff check --select ANN --ignore ANN401 "${changed[@]}"
            fi
            if git cat-file -e "FETCH_HEAD:.basedpyright/baseline.json" 2>/dev/null; then
              git show "FETCH_HEAD:.basedpyright/baseline.json" > /tmp/baseline-base.json
              git show "HEAD:.basedpyright/baseline.json" > /tmp/baseline-head.json 2>/dev/null \
                || echo '{"files": {}}' > /tmp/baseline-head.json
              python3 - <<'PY'
          import collections, json, sys
          def counts(path):
              files = json.load(open(path))["files"]
              return collections.Counter(e["code"] for es in files.values() for e in es)
          base, head = counts("/tmp/baseline-base.json"), counts("/tmp/baseline-head.json")
          grown = {c: (base[c], n) for c, n in head.items() if n > base[c]}
          for code, (b, n) in sorted(grown.items()):
              print(f"::error::type baseline grew for {code}: {b} -> {n}. Fix the new errors instead of re-baselining.")
          sys.exit(1 if grown else 0)
          PY
            fi
          fi

      - name: Run tests with coverage
        run: |
          python -m coverage run -m pytest tests/ -v --ignore=tests/test_notifications.py
          python -m coverage report

      # repository-baseline-policy.md §5.1 — a badge whose value is written by
      # a human is forbidden: it renders identically to a real one and becomes
      # false the moment reality moves without anyone editing a file. This
      # repo carried a hand-set `tests-429_passing` badge while the suite
      # measured 586 passing, and a hand-set `PyPI-v0.6.0rc3` badge against a
      # published v0.16.4. The README coverage badge now renders whatever
      # this step last published, derived from the same `.coverage` file the
      # `[tool.coverage.report] fail_under` gate in pyproject.toml reads.
      #
      # Pushes to main only: a pull-request run measures a tree that is not
      # yet what a reader of the README is looking at.
      - name: Publish coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/ci-scripts/publish_coverage_badge.sh

      - name: Verify the test suite left the checkout clean
        # A tracked file mutated by the suite (alpha-engine-config-I8299 —
        # flow_doctor.db was tracked AND written by pytest) or a new
        # untracked file left behind is test residue that must be
        # gitignored or fixtured with tmp_path, not discovered by hand.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::pytest left the checkout dirty — a test wrote to a tracked or untracked repo file instead of tmp_path:"
            git status --porcelain
            git diff
            exit 1
          fi

      - name: Security audit
        run: |
          pip install pip-audit
          IGNORE_ARGS=()
          if [ -f .github/pip-audit-ignore.txt ]; then
            while IFS= read -r vuln_id; do
              IGNORE_ARGS+=(--ignore-vuln "$vuln_id")
            done < <(grep -vE '^\s*#|^\s*$' .github/pip-audit-ignore.txt)
          fi
          pip-audit "${IGNORE_ARGS[@]}"
